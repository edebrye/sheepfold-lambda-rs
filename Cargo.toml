[workspace]
resolver = "3"
members = [
    "sheepfold-adder",
    "sheepfold-lister",
    "sheepfold-model",
    "sheepfold-reader",
    "sheepfold-remover",
]

[workspace.dependencies]
lambda_http = { version = "1.0.0", default-features = false, features = ["apigw_rest", "tracing"]}
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
aws-config = "1"
aws-sdk-dynamodb = "1"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.151"
