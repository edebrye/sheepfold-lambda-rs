[workspace]
resolver = "3"
members = [
    "sheepfold-adder",
    "sheepfold-lambda-utils",
    "sheepfold-lister",
    "sheepfold-model",
    "sheepfold-reader",
    "sheepfold-remover",
]

[workspace.dependencies]
lambda_http = { version = "1.0.0", default-features = false, features = ["apigw_rest", "tracing"]}
tokio = { version = "1", features = ["macros", "rt"] }
serde_json = "1.0.151"
toasty = { version = "0.11.0", features = ["dynamodb"] }

[profile.release]
opt-level = "s"
